<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expanded Platformer</title>
    <style>
        body { margin: 0; overflow: hidden; background: #5c94fc; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'Courier New', Courier, monospace; }
        canvas { border: 4px solid #000; background: #5c94fc; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        .ui { position: absolute; top: 20px; left: 20px; color: white; text-shadow: 2px 2px #000; pointer-events: none; z-index: 10; }
    </style>
</head>
<body>

    <div class="ui">
        <h1 id="scoreLabel">COINS: 0</h1>
        <p>ARROWS to Move | Reach the end!</p>
    </div>
    <canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

canvas.width = 800;
canvas.height = 400;

const gravity = 0.8;
const friction = 0.8;
let score = 0;

const player = {
    x: 50,
    y: 300,
    width: 30,
    height: 30,
    speed: 5,
    velX: 0,
    velY: 0,
    jumping: false,
    color: '#ff0000'
};

// Camera object to follow player
const camera = {
    x: 0,
    width: canvas.width
};

const platforms = [
    { x: 0, y: 370, width: 2000, height: 30 },   // Long Ground
    { x: 200, y: 280, width: 100, height: 20 },
    { x: 450, y: 220, width: 100, height: 20 },
    { x: 700, y: 150, width: 150, height: 20 },
    { x: 1000, y: 250, width: 200, height: 20 },
    { x: 1300, y: 180, width: 100, height: 20 },
    { x: 1600, y: 280, width: 300, height: 20 }
];

const coins = [
    { x: 235, y: 240, width: 15, height: 15, collected: false },
    { x: 485, y: 180, width: 15, height: 15, collected: false },
    { x: 750, y: 110, width: 15, height: 15, collected: false },
    { x: 1100, y: 210, width: 15, height: 15, collected: false }
];

const keys = {};
window.addEventListener('keydown', e => keys[e.code] = true);
window.addEventListener('keyup', e => keys[e.code] = false);

function update() {
    if (keys['ArrowUp'] || keys['KeyW'] || keys['Space']) {
        if (!player.jumping) {
            player.jumping = true;
            player.velY = -player.speed * 2.5;
        }
    }
    if (keys['ArrowRight'] || keys['KeyD']) {
        if (player.velX < player.speed) player.velX++;
    }
    if (keys['ArrowLeft'] || keys['KeyA']) {
        if (player.velX > -player.speed) player.velX--;
    }

    player.velX *= friction;
    player.velY += gravity;
    player.x += player.velX;
    player.y += player.velY;

    // Platform Collision
    player.jumping = true; 
    platforms.forEach(plat => {
        if (player.x < plat.x + plat.width &&
            player.x + player.width > plat.x &&
            player.y < plat.y + plat.height &&
            player.y + player.height > plat.y) {
            
            if (player.velY > 0 && player.y + player.height - player.velY <= plat.y) {
                player.jumping = false;
                player.velY = 0;
                player.y = plat.y - player.height;
            }
        }
    });

    // Coin Collection
    coins.forEach(coin => {
        if (!coin.collected &&
            player.x < coin.x + coin.width &&
            player.x + player.width > coin.x &&
            player.y < coin.y + coin.height &&
            player.y + player.height > coin.y) {
            coin.collected = true;
            score += 100;
            document.getElementById('scoreLabel').innerText = `COINS: ${score}`;
        }
    });

    // Camera Logic: Center player on screen
    camera.x = player.x - canvas.width / 2;
    if (camera.x < 0) camera.x = 0;
    if (camera.x > 1200) camera.x = 1200; // Stop at end of level

    if (player.x < 0) player.x = 0;
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    // Shift the entire drawing based on camera position
    ctx.translate(-camera.x, 0);

    // Draw Platforms
    platforms.forEach(plat => {
        ctx.fillStyle = '#8b4513';
        ctx.fillRect(plat.x, plat.y, plat.width, plat.height);
        ctx.fillStyle = '#228b22';
        ctx.fillRect(plat.x, plat.y, plat.width, 5);
    });

    // Draw Coins
    ctx.fillStyle = '#ffd700';
    coins.forEach(coin => {
        if (!coin.collected) {
            ctx.beginPath();
            ctx.arc(coin.x + 7, coin.y + 7, 7, 0, Math.PI * 2);
            ctx.fill();
        }
    });

    // Draw Player
    ctx.fillStyle = player.color;
    ctx.fillRect(player.x, player.y, player.width, player.height);
    ctx.fillStyle = "white";
    ctx.fillRect(player.x + 18, player.y + 5, 5, 5);

    ctx.restore();
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
